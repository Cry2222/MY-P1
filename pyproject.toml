[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myp1"
version = "0.1.0"
description = "Modular auto-trading bot with a Telegram control surface"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Core: the exchange client and nothing else. Everything here is pure Python
# and installs under Termux, which is what makes the on-device deployment in
# docs/on-device.md possible. Optional extras below add the pieces that need a
# compiler or are simply not wanted on a phone.
dependencies = [
    "ccxt>=4.4",
]

[project.optional-dependencies]
# FastAPI control API. Needs pydantic-core (Rust) — skip it on a phone and the
# dependency-free server in myp1/api/lite.py takes over automatically.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
telegram = [
    "python-telegram-bot>=21.0",
]
all = [
    "myp1[server,telegram]",
]
dev = [
    "myp1[server,telegram]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
myp1 = "myp1.app:main"

[tool.setuptools.packages.find]
include = ["myp1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:myp1.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a call in an argument default.
# Hoisting it out, as B008 asks, breaks the framework.
"myp1/api/server.py" = ["B008"]
