[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myp1"
version = "0.1.0"
description = "Modular auto-trading bot with a Telegram control surface"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ccxt>=4.4",
    "python-telegram-bot>=21.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
myp1 = "myp1.app:main"

[tool.setuptools.packages.find]
include = ["myp1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:myp1.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a call in an argument default.
# Hoisting it out, as B008 asks, breaks the framework.
"myp1/api/server.py" = ["B008"]
